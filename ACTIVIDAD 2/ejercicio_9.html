<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Consumo de API con Fetch</title>
</head>
<body>
  <h1>Ejercicio 9 - Consumo de API con promesas</h1>
  <!-- Prepara un botón para iniciar el consumo de la API de GitHub y mostrar la información del usuario -->
  <!-- El botón inicia la carga de publicaciones desde la API de GitHub que se agregan al div resultado -->
  <button id="botonCargar">Cargar datos</button>
  <div id="resultado"></div>

  <!-- Script que realiza la petición Fetch a la API de GitHub y muestra la información del usuario -->
  <script>
    // 1. Referencias al DOM
    const botonCargar = document.getElementById('botonCargar');
    const resultado = document.getElementById('resultado');

    // 2. Función que consulta la API: fetch devuelve una promesa con los datos
    function obtenerUsuario() {
      const url = 'https://api.github.com/users/1';

      return fetch(url)
        .then(respuesta => {
          if (!respuesta.ok) {
            throw new Error(`Error HTTP: ${respuesta.status} - ${respuesta.statusText}`);
          }
          return respuesta.json();
        });
    }

    // 3. Consumir la promesa y mostrar la información del usuario
    function cargarDatos() {
      resultado.textContent = '';

      obtenerUsuario()
        .then(datos => {
          console.log('Los datos recibidos son:', datos);

          const resumen = document.createElement('p');
          resumen.textContent = `Petición => Login: ${datos.login}, URL: ${datos.html_url}`;
          resultado.appendChild(resumen);

          Object.entries(datos).forEach(([atributo, valor]) => {
            const parrafo = document.createElement('p');
            parrafo.innerHTML = `valor <strong>${valor}</strong>`;
            resultado.appendChild(parrafo);
          });
        })
        .catch(error => {
          console.error('No se pudo cargar la información del usuario:', error);
          const parrafo = document.createElement('p');
          parrafo.textContent = `Error al conectar con la API: ${error.message}`;
          resultado.appendChild(parrafo);
        })
        .finally(() => {
          console.log('Consulta a la API finalizada.');
        });
    }

    // 4. Asociar la rutina al botón
    botonCargar.addEventListener('click', cargarDatos);
  </script>
</body>
</html>
